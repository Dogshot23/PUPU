<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUPU (MVP)</title>
  <meta name="theme-color" content="#fdf6ec">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="hero">
      <div class="bubble" id="bubble">
        <p class="beat">Press PUPU's belly to hear a thought.</p>
      </div>

      <div class="pupu-stage">
        <img class="pupu-shadow" src="images/pupu/effects/effect_shadow.png" alt="">

        <div class="pupu-float-wrap">
          <div class="pupu-circle" id="pupu-circle">
            <img class="pupu-body" id="pupu-body" src="images/pupu/body/body.png" alt="PUPU">
            <img class="pupu-arm pupu-arm-left" id="pupu-arm-left" src="images/pupu/body/body_left_arm.png" alt="">
            <img class="pupu-arm pupu-arm-right" id="pupu-arm-right" src="images/pupu/body/body_right_arm.png" alt="">
            <img class="pupu-eye" id="pupu-eyes" src="images/pupu/eyes/eyes_open.png" alt="">
            <img class="pupu-mouth" id="pupu-mouth" src="images/pupu/mouths/mouth_neutral.png" alt="">
            <img class="pupu-button" id="pupu-button" src="images/pupu/buttons/button_unpressed.png" alt="Press PUPU's belly to hear a thought" role="button" tabindex="0">
          </div>
        </div>
      </div>
    </div>

    <p class="status" id="status"></p>

    <button class="install-button" id="install-button" hidden>Install PUPU</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
