  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUPU (MVP)</title>
  <meta property="og:title" content="PUPU">
  <meta property="og:description" content="A free English conversation companion — press PUPU's belly for a fact, joke, riddle, or story to talk about.">
  <meta property="og:url" content="https://xn--ok8ba.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://xn--ok8ba.com/images/promotion/fb_preview001.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PUPU">
  <meta name="twitter:description" content="A free English conversation companion — press PUPU's belly for a fact, joke, riddle, or story to talk about.">
  <meta name="twitter:image" content="https://xn--ok8ba.com/images/promotion/fb_preview001.png">
  <meta name="theme-color" content="#fdf6ec">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ghost-overlay" id="ghost-overlay"></div>
  <main class="container">
    <div class="hero">
      <div class="bubble-wrap" id="bubble-wrap">
        <div class="bubble" id="bubble" role="button" tabindex="0" aria-label="PUPU's speech bubble. Tap to skip typing or continue to the next part.">
          <p class="beat">Press PUPU's belly to hear a thought.</p>
        </div>
        <div class="language-toggle" id="language-toggle" role="group" aria-label="Choose a language"></div>
      </div>

      <div class="pupu-stage">
        <img class="pupu-shadow" id="pupu-shadow" src="images/pupu/effects/effect_shadow.png" alt="">

        <div class="pupu-float-wrap">
          <div class="pupu-circle" id="pupu-circle">
            <img class="pupu-body" id="pupu-body" src="images/pupu/body/body.png" alt="PUPU">
            <img class="pupu-body pupu-body-ghost" id="pupu-body-ghost" src="images/pupu/body/body_ghost.png" alt="">
            <img class="pupu-arm pupu-arm-left" id="pupu-arm-left" src="images/pupu/body/body_left_arm.png" alt="">
            <img class="pupu-arm pupu-arm-right" id="pupu-arm-right" src="images/pupu/body/body_right_arm.png" alt="">
            <img class="pupu-eye" id="pupu-eyes" src="images/pupu/eyes/eyes_open.png" alt="">
            <img class="pupu-mouth" id="pupu-mouth" src="images/pupu/mouths/mouth_neutral.png" alt="">
            <img class="pupu-layer pupu-hat" id="pupu-hat" alt="">
            <img class="pupu-layer pupu-item" id="pupu-item" alt="">
            <img class="pupu-layer pupu-effect" id="pupu-effect" alt="">
            <img class="pupu-button" id="pupu-button" src="images/pupu/buttons/button_unpressed.png" alt="Press PUPU's belly to hear a thought" role="button" tabindex="0">
          </div>
        </div>
      </div>
    </div>

    <p class="status" id="status"></p>

    <button class="install-button" id="install-button" hidden>Install PUPU</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
